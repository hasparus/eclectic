<title>Paw Ornament Workshop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Pacifico&family=Lobster&family=Fredoka:wght@600&display=swap">
<style>
/* Layout: a cutting board (ornament, millimetre rule, cut stats, exports) beside a tool rail (pads first, then cutting), variations underneath. */
:root {
  --bg: #eef0f2;
  --surface: #f8f9fa;
  --board: #dcdfe3;
  --ink: #15181c;
  --muted: #5d6670;
  --line: #c9ced4;
  --material: #15181c;
  --cut: #d6332b;
  --select: #2b62d6;
  --select-soft: rgba(43, 98, 214, 0.1);
  --ok: #1f7a4d;
  --ok-bg: #dcefe4;
  --warn: #9a4d00;
  --warn-bg: #fbe8cf;
  --focus: #2b62d6;
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16191d; --surface: #1d2126; --board: #262b31; --ink: #e9ecef; --muted: #9aa3ad; --line: #353b43;
    --material: #e4d9c6; --cut: #ff6a5e; --select: #7fa6ff; --select-soft: rgba(127, 166, 255, 0.2);
    --ok: #7fd4a4; --ok-bg: #1d3a2b; --warn: #ffb35c; --warn-bg: #3d2a12; --focus: #7fa6ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16191d; --surface: #1d2126; --board: #262b31; --ink: #e9ecef; --muted: #9aa3ad; --line: #353b43;
  --material: #e4d9c6; --cut: #ff6a5e; --select: #7fa6ff; --select-soft: rgba(127, 166, 255, 0.2);
  --ok: #7fd4a4; --ok-bg: #1d3a2b; --warn: #ffb35c; --warn-bg: #3d2a12; --focus: #7fa6ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 1200px; margin: 0 auto; display: grid; gap: 22px; }
header { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px 24px; }
header > div:first-child { display: grid; gap: 6px; min-width: 0; flex: 1 1 420px; }
h1 { font: 400 clamp(26px, 4vw, 36px)/1.1 var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
header p { margin: 0; color: var(--muted); max-width: 66ch; }
.studio { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; align-items: start; }
@media (max-width: 900px) { .studio { grid-template-columns: minmax(0, 1fr); } }

/* board */
.board { background: var(--board); border-radius: var(--radius); padding: 18px; display: grid; gap: 12px; min-width: 0; }
@media (min-width: 901px) { .board { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); } }
.stage { position: relative; aspect-ratio: 1 / 0.97; max-width: 100%; }
.stage > svg { width: 100%; height: 100%; display: block; touch-action: manipulation; }
.busy { position: absolute; top: 2px; right: 4px; font: 500 12px var(--font-data); color: var(--muted); opacity: 0; transition: opacity .2s; pointer-events: none; }
.stage.working .busy { opacity: 1; }
.material { fill: var(--material); }
.cutline { fill: none; stroke: var(--cut); stroke-width: 1.1px; vector-effect: non-scaling-stroke; }
.pad-hit { fill: transparent; stroke: transparent; stroke-width: 2px; vector-effect: non-scaling-stroke; cursor: pointer; }
.pad-hit:hover { stroke: var(--select); stroke-dasharray: 5 4; }
.pad-hit.selected { stroke: var(--select); fill: var(--select-soft); stroke-dasharray: none; }
.thin { fill: none; stroke: var(--warn); stroke-width: 2px; vector-effect: non-scaling-stroke; pointer-events: none; }
.rule line { stroke: var(--muted); vector-effect: non-scaling-stroke; stroke-width: 1px; }
.rule text { fill: var(--muted); font-family: var(--font-data); }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 20px; align-items: center; font: 13px var(--font-data); font-variant-numeric: tabular-nums; color: var(--muted); min-height: 24px; }
.stats b { color: var(--ink); font-weight: 500; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 99px; background: var(--ok-bg); color: var(--ok); font: 500 12px var(--font-body); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.note { font-size: 13px; color: var(--muted); min-height: 1.5em; }
.note textarea { display: block; margin-top: 6px; width: 100%; height: 110px; font: 12px var(--font-data); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }

/* controls */
button { font: 500 14px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 13px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--muted); }
button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.rail { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 16px; min-width: 0; }
.group { display: grid; gap: 10px; min-width: 0; }
.group + .group { border-top: 1px solid var(--line); padding-top: 16px; }
.label { font: 600 11px var(--font-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row input[type="text"] { flex: 1 1 120px; min-width: 0; }
input[type="text"] { font: 500 15px var(--font-data); padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg.full { display: grid; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { text-align: center; padding: 6px 12px; font-size: 13.5px; cursor: pointer; border-left: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.seg label:first-of-type { border-left: 0; }
.seg input:checked + label { background: var(--ink); color: var(--bg); }
.seg input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: -2px; }
.field { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; font-size: 14px; }
.field output { font: 13px var(--font-data); font-variant-numeric: tabular-nums; color: var(--muted); }
.field input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--ink); }
.field.disabled { opacity: .45; }
.small { font-size: 12.5px; color: var(--muted); margin: -4px 0 0; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.check input { accent-color: var(--ink); width: 16px; height: 16px; }

/* pad picker + palette */
.picker-wrap { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 12px; align-items: center; }
#picker { width: 100%; height: auto; display: block; }
#picker path { fill: var(--board); stroke: var(--muted); stroke-width: 1.5px; vector-effect: non-scaling-stroke; cursor: pointer; }
#picker path:hover { stroke: var(--select); }
#picker path[aria-checked="true"] { fill: var(--select-soft); stroke: var(--select); stroke-width: 2.5px; }
#picker path:focus-visible { outline: none; stroke: var(--focus); stroke-width: 3px; }
.picked { display: grid; gap: 2px; font-size: 14px; }
.picked b { font: 400 18px var(--font-display); }
.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
.tile { padding: 6px 6px 4px; display: grid; gap: 3px; background: var(--board); border: 2px solid transparent; border-radius: 8px; font-size: 12px; color: var(--muted); }
.tile svg { width: 100%; aspect-ratio: 1; display: block; }
.tile[aria-pressed="true"] { border-color: var(--select); color: var(--ink); }
.tile .material { opacity: 0; transition: opacity .15s; }
.tile.ready .material { opacity: 1; }

/* variations */
.variations { display: grid; gap: 10px; }
.variations .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.variations h2 { font: 400 22px var(--font-display); margin: 0; }
.thumbs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .thumbs { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.thumb { padding: 10px 10px 8px; background: var(--board); border: 1px solid transparent; display: grid; gap: 6px; text-align: center; font: 12px var(--font-data); color: var(--muted); }
.thumb svg { width: 100%; aspect-ratio: 1; display: block; }
footer { font-size: 13px; color: var(--muted); max-width: 80ch; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1 data-i18n="title">Paw Ornament Workshop</h1>
      <p data-i18n="lede"></p>
    </div>
    <div class="seg" role="radiogroup" aria-label="Language">
      <input type="radio" name="lang" id="lang-pl" value="pl"><label for="lang-pl">PL</label>
      <input type="radio" name="lang" id="lang-en" value="en"><label for="lang-en">EN</label>
    </div>
  </header>

  <section class="studio">
    <div class="board">
      <div class="stage" id="stage">
        <svg id="preview" viewBox="0 0 1000 970" role="img" aria-label="Paw ornament preview"></svg>
        <span class="busy" data-i18n="working"></span>
      </div>
      <p class="hint" data-i18n="padsHint"></p>
      <div class="stats" id="stats" aria-live="polite"></div>
      <div class="actions">
        <div class="seg" role="radiogroup" aria-label="View">
          <input type="radio" name="view" id="view-fill" value="fill" checked><label for="view-fill" data-i18n="stencil"></label>
          <input type="radio" name="view" id="view-cut" value="cut"><label for="view-cut" data-i18n="cutLines"></label>
        </div>
        <label class="check"><input type="checkbox" id="show-thin" checked> <span data-i18n="showThin"></span></label>
      </div>
      <div class="actions" id="exports">
        <button class="primary" id="save-svg-fill" data-i18n="saveSvg"></button>
        <button id="save-svg-cut" data-i18n="saveCut"></button>
        <button id="save-pdf-fill" data-i18n="savePdf"></button>
        <button id="save-png" data-i18n="savePng"></button>
        <button id="copy" data-i18n="copy"></button>
      </div>
      <div class="note" id="note" role="status"></div>
    </div>

    <form class="rail" id="controls" autocomplete="off">
      <div class="group">
        <span class="label" data-i18n="seed"></span>
        <div class="row">
          <input type="text" id="seed" spellcheck="false" aria-label="Seed">
          <button type="button" id="dice" data-i18n="shuffle"></button>
        </div>
        <div class="row">
          <button type="button" id="undo" data-i18n="undo" aria-keyshortcuts="Control+Z"></button>
          <button type="button" id="redo" data-i18n="redo" aria-keyshortcuts="Control+Shift+Z"></button>
          <div class="seg" role="radiogroup" aria-label="Paw" style="margin-left:auto">
            <input type="radio" name="paw" id="paw-dog" value="dog"><label for="paw-dog" data-i18n="dog"></label>
            <input type="radio" name="paw" id="paw-cat" value="cat"><label for="paw-cat" data-i18n="cat"></label>
          </div>
        </div>
      </div>

      <div class="group">
        <span class="label" data-i18n="pads"></span>
        <div class="picker-wrap">
          <svg id="picker" role="radiogroup" aria-label="Pads"></svg>
          <div class="picked" id="picked"></div>
        </div>
        <div class="palette" id="palette"></div>
        <div class="row">
          <button type="button" id="reroll" data-i18n="reroll"></button>
          <button type="button" id="apply-toes" data-i18n="applyToes"></button>
          <button type="button" id="mix-toes" data-i18n="mixToes"></button>
        </div>
      </div>

      <div class="group" id="scene-group">
        <span class="label" data-i18n="scene"></span>
        <div id="name-fields" class="group" style="gap:8px">
          <label class="field"><span data-i18n="nameText"></span><input type="text" id="name-text" maxlength="24" style="grid-column:1/-1"></label>
          <div class="seg full" role="radiogroup" aria-label="Typeface">
            <input type="radio" name="font" id="font-Pacifico" value="Pacifico"><label for="font-Pacifico" style="font-family:Pacifico,cursive">Pacifico</label>
            <input type="radio" name="font" id="font-Lobster" value="Lobster"><label for="font-Lobster" style="font-family:Lobster,cursive">Lobster</label>
            <input type="radio" name="font" id="font-Fredoka" value="Fredoka"><label for="font-Fredoka" style="font-family:Fredoka,sans-serif;font-weight:600">Fredoka</label>
          </div>
        </div>
        <label class="field"><span data-i18n="trees"></span> <output id="trees-out"></output><input type="range" id="trees" min="0" max="1" step="0.05"></label>
        <label class="field"><span data-i18n="wind"></span> <output id="wind-out"></output><input type="range" id="wind" min="0" max="4" step="1"></label>
        <label class="field"><span data-i18n="waves"></span> <output id="waves-out"></output><input type="range" id="waves" min="0" max="5" step="1"></label>
        <label class="check" id="branch-field"><input type="checkbox" id="branches"> <span data-i18n="branch"></span></label>
      </div>

      <div class="group">
        <span class="label" data-i18n="cutting"></span>
        <label class="field"><span data-i18n="width"></span> <output id="widthMm-out"></output><input type="range" id="widthMm" min="50" max="160" step="1"></label>
        <label class="field"><span data-i18n="line"></span> <output id="lineMm-out"></output><input type="range" id="lineMm" min="0.4" max="1.6" step="0.05"></label>
        <p class="small" data-i18n="lineHint"></p>
        <label class="field"><span data-i18n="rim"></span> <output id="borderMm-out"></output><input type="range" id="borderMm" min="2" max="7" step="0.1"></label>
        <label class="field"><span data-i18n="bridge"></span> <output id="ringMm-out"></output><input type="range" id="ringMm" min="1" max="4" step="0.1"></label>
        <label class="field"><span data-i18n="kerf"></span> <output id="kerfMm-out"></output><input type="range" id="kerfMm" min="0" max="0.4" step="0.01"></label>
        <p class="small" data-i18n="kerfHint"></p>
        <label class="field"><span data-i18n="minFeature"></span> <output id="minFeatureMm-out"></output><input type="range" id="minFeatureMm" min="0.2" max="1.5" step="0.05"></label>
        <label class="check"><input type="checkbox" id="web"> <span data-i18n="web"></span></label>
        <label class="check"><input type="checkbox" id="hole"> <span data-i18n="hole"></span></label>
        <label class="field" id="hole-field"><span data-i18n="holeSize"></span> <output id="holeMm-out"></output><input type="range" id="holeMm" min="3" max="10" step="0.5"></label>
      </div>
      <div class="group">
        <button type="button" id="reset" data-i18n="reset"></button>
      </div>
    </form>
  </section>

  <section class="variations">
    <div class="head">
      <h2 data-i18n="variations"></h2>
      <button type="button" id="more" data-i18n="moreVariations"></button>
    </div>
    <p class="hint" data-i18n="variationsHint"></p>
    <div class="thumbs" id="thumbs"></div>
  </section>

  <footer data-i18n="footer"></footer>
</div>

<script>/*APP*/</script>
